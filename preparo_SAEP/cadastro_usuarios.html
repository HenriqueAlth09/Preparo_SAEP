
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuários</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="navbar-brand">
            Gerenciamento de Tarefas
        </div>

        <nav class="navbar-links">
            <a href="cadastro_usuarios.html">Cadastro de Usuários</a>
            <a href="cadastro_tarefas.html">Cadastro de Tarefas</a>
            <a href="gerenciar_tarefas.html">Gerenciar Tarefas</a>
        </nav>

    </header>

    <main class="container">

        <h1>Cadastro de Usuários</h1>

        <form id="form-usuario" novalidate>

            <div class="form-group">
                <label for="nome">Nome:</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Cadastrar
            </button>

        </form>

        <p id="mensagem" class="mensagem" aria-live="polite"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>

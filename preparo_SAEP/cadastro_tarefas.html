
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Tarefas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="navbar-brand">
            Gerenciamento de Tarefas
        </div>

        <nav class="navbar-links">
            <a href="cadastro_usuarios.html">Cadastro de Usuários</a>
            <a href="cadastro_tarefas.html">Cadastro de Tarefas</a>
            <a href="gerenciar_tarefas.html">Gerenciar Tarefas</a>
        </nav>

    </header>

    <main class="container">

        <h1>Cadastro de Tarefas</h1>

        <form id="form-tarefa" novalidate>

            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <input
                    type="text"
                    id="descricao"
                    name="descricao"
                    required
                >
            </div>

            <div class="form-group">
                <label for="nome_setor">Setor:</label>
                <input
                    type="text"
                    id="nome_setor"
                    name="nome_setor"
                    required
                >
            </div>

            <div class="form-group">
                <label for="id_usuario">Usuário:</label>

                <select id="id_usuario" name="id_usuario" required>
                    <option value="">Selecione um usuário...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prioridade">Prioridade:</label>

                <select id="prioridade" name="prioridade" required>
                    <option value="baixa">Baixa</option>
                    <option value="média">Média</option>
                    <option value="alta">Alta</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">
                Cadastrar
            </button>

        </form>

        <p id="mensagem" class="mensagem" aria-live="polite"></p>

    </main>
    
    <script src="script.js"></script>

</body>
</html>
